<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>特朗普专区 · 宏观研究工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">
<script src="../lib/echarts.min.js"></script>
<style>
:root{--bg:#101216;--card:#171a20;--line:#2a2e37;--txt:#e8e6e1;--dim:#9a958c;--gold:#d4a944;--green:#4caf7d;--red:#e5534b;--blue:#5b9bd5;--orange:#e5864b;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:14px;line-height:1.7;padding:26px 20px 60px;}
.wrap{max-width:1180px;margin:0 auto}
h1{font-family:'Noto Serif SC',serif;font-weight:900;font-size:26px}
h1 em{font-style:normal;background:linear-gradient(transparent 62%,rgba(212,169,68,.45) 0)}
.sub{color:var(--dim);font-size:12.5px;margin:4px 0 18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat .k{color:var(--dim);font-size:12px}
.stat .v{font-size:24px;font-weight:700;margin-top:2px}
.stat .d{color:var(--dim);font-size:11px;margin-top:2px}
.up{color:var(--red)} .down{color:var(--green)} .flat{color:var(--gold)}
.tabbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tabbar button{background:var(--card);color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:8px 16px;font-family:inherit;font-size:13px;cursor:pointer}
.tabbar button.on{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}
.panel{display:none} .panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.card h3{font-size:14px;color:var(--gold);margin-bottom:8px}
.chart{width:100%;height:420px}
.chart2{width:100%;height:300px}
.rng{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.rng button{background:transparent;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:3px 10px;font-size:12px;font-family:inherit;cursor:pointer}
.rng button.on{color:var(--gold);border-color:var(--gold)}
.note{color:var(--dim);font-size:11.5px;margin-top:8px}
/* TACO事件 */
.ev{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;background:var(--card)}
.ev-hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap;cursor:pointer}
.ev-date{color:var(--dim);font-size:12px}
.badge{border-radius:5px;padding:1px 8px;font-size:11px;font-weight:700}
.b-最强{background:rgba(229,83,75,.18);color:var(--red);border:1px solid var(--red)}
.b-强{background:rgba(229,134,75,.15);color:var(--orange);border:1px solid var(--orange)}
.b-中强{background:rgba(212,169,68,.14);color:var(--gold);border:1px solid var(--gold)}
.b-中{background:rgba(154,149,140,.12);color:var(--dim);border:1px solid var(--dim)}
.b-地缘,.b-财政{background:rgba(91,155,213,.13);color:var(--blue);border:1px solid var(--blue)}
.ev-title{font-weight:700}
.ev-body{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:13px}
.ev.open .ev-body{display:block}
.ev-body p{margin-bottom:8px}
.ev-body .tag{display:inline-block;color:#111;background:var(--gold);border-radius:4px;padding:0 6px;font-size:11px;margin-right:6px}
.ev-body .tag.t2{background:var(--blue)} .ev-body .tag.t3{background:var(--dim)} .ev-body .tag.t4{background:var(--green)}
.filterRow{margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filterRow input{background:#0d0f13;border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:7px 10px;font-family:inherit;font-size:12.5px;width:240px}
.fbtn{background:transparent;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:5px 12px;font-size:12px;font-family:inherit;cursor:pointer}
.fbtn.on{color:var(--gold);border-color:var(--gold)}
/* truths */
.post{border-bottom:1px solid #22262e;padding:10px 4px;font-size:13px}
.post .tm{color:var(--dim);font-size:11.5px;margin-bottom:2px}
.post a{color:var(--gold);text-decoration:none}
.post.rt{opacity:.55}
mark{background:rgba(212,169,68,.35);color:#ffe9a8;border-radius:3px;padding:0 2px}
/* polymarket */
.mk{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;background:var(--card)}
.mk-q{font-weight:700;margin-bottom:8px}
.oc{display:flex;align-items:center;gap:10px;margin:5px 0}
.oc .nm{width:130px;color:var(--dim);font-size:12.5px;flex-shrink:0}
.oc .bar{flex:1;height:16px;background:#0d0f13;border-radius:4px;overflow:hidden}
.oc .fill{height:100%;background:var(--gold)}
.oc .pc{width:56px;text-align:right;font-weight:700}
.src{margin-top:24px;color:var(--dim);font-size:11.5px;border-top:1px solid var(--line);padding-top:12px}
a.lnk{color:var(--gold);text-decoration:none}
.empty{color:var(--dim);text-align:center;padding:40px 0;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>特朗普执政<em>关注焦点</em></h1>
  <div class="sub">政策压力 · 民调 · TACO回撤 · Truth Social · 政策预期 —— 数据每日管线自动更新</div>

  <div class="stats" id="stats"></div>

  <div class="tabbar" id="tabs">
    <button data-p="p1" class="on">压力指数</button>
    <button data-p="p2">支持率</button>
    <button data-p="p3">TACO事件复盘</button>
    <button data-p="p4">Truths跟踪</button>
    <button data-p="p5">政策预期</button>
  </div>

  <div class="panel on" id="p1">
    <div class="card">
      <h3>川普压力指数（TACO指数）· 总指数与分项贡献</h3>
      <div class="rng" id="rng1">
        <button data-r="90">近3月</button><button data-r="180">近6月</button><button data-r="365" class="on">近1年</button><button data-r="0">全部</button>
      </div>
      <div class="chart" id="chPressure"></div>
      <div class="note">柱=分项贡献（净支持/10Y/MOVE/S&P/VIX/CPI Nowcast，堆叠）；金线=总指数。短标=强/最强TACO回撤事件。口径：60%纯20日变化+40%第二任期绝对压力分位。</div>
    </div>
  </div>

  <div class="panel" id="p2">
    <div class="card">
      <h3>川普净支持率（支持率−反对率）</h3>
      <div class="rng" id="rng2">
        <button data-r="180">近6月</button><button data-r="365" class="on">近1年</button><button data-r="0">全部</button>
      </div>
      <div class="chart" id="chApproval"></div>
      <div class="note">短标=关键政策节点。数据源：Silver Bulletin / The Economist（经ocmacro整理）。</div>
    </div>
  </div>

  <div class="panel" id="p3">
    <div class="filterRow">
      <input id="evQ" placeholder="筛选事件，如：关税 / 伊朗 / 鲍威尔…">
      <span class="note" id="evCnt"></span>
    </div>
    <div id="evList"></div>
  </div>

  <div class="panel" id="p4">
    <div class="filterRow">
      <button class="fbtn on" data-f="all">全部</button>
      <button class="fbtn" data-f="orig">仅原创</button>
      <button class="fbtn" data-f="kw">只看市场关键词</button>
      <input id="postQ" placeholder="自定义筛选词…">
      <span class="note" id="postCnt"></span>
    </div>
    <div class="card"><div id="postList"></div></div>
  </div>

  <div class="panel" id="p5">
    <div id="mkList"></div>
  </div>

  <div class="src" id="srcNote"></div>
  <div class="src"><a class="lnk" href="../index.html">← 返回工作台</a> · <a class="lnk" href="../reports/weekly_2026-W35.html">宏观周报 ↗</a> · <a class="lnk" href="mm_upload.html">更新MM数据 ↗</a></div>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let TZ=null, TR=null;

/* ---------- 页签 ---------- */
$('tabs').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id===b.dataset.p));
  setTimeout(()=>{Object.values(CH).forEach(c=>c.resize&&c.resize());},30);
});
const CH={};

/* ---------- 统计卡 ---------- */
function renderStats(){
  const p=TZ.pressure, a=TZ.approval;
  const pc=p.value>0?'up':(p.value<0?'down':'flat');
  const ac=a.net>0?'up':'down';
  const lastPost=TR&&TR.posts.length?new Date(TR.posts[0].t):null;
  $('stats').innerHTML=
    `<div class="stat"><div class="k">川普压力指数</div><div class="v ${pc}">${p.value>0?'+':''}${p.value}%</div><div class="d">截至 ${p.asof} · L3·ocmacro</div></div>
     <div class="stat"><div class="k">净支持率</div><div class="v ${ac}">${a.net>0?'+':''}${a.net}%</div><div class="d">支持 ${a.approve}% / 反对 ${a.disapprove}% · ${a.asof}</div></div>
     <div class="stat"><div class="k">TACO事件复盘</div><div class="v flat">${TZ.taco_events.length}条</div><div class="d">更新至 ${TZ.taco_updated||'—'}</div></div>
     <div class="stat"><div class="k">Truth Social存档</div><div class="v flat">${(TR.total_in_archive/10000).toFixed(1)}万条</div><div class="d">最新 ${lastPost?lastPost.toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})+' 北京':''}</div></div>`;
  $('srcNote').innerHTML='数据来源：'+esc(TZ.source)+'；'+esc(TR.source)+'。抓取时间 '+(TZ.fetched_at||'').slice(0,16).replace('T',' ')+' UTC · 特朗普专区为本工作台数据镜像，标注L3·第三方。';
}

/* ---------- 压力指数图 ---------- */
const COMP=[['approval','净支持','#e5534b'],['dgs10','10Y','#e5864b'],['move','MOVE','#d4a944'],['sp500','S&P','#5b9bd5'],['vix','VIX','#8b6fd5'],['cpinow','CPI Nowcast','#4caf7d']];
function cutDays(arr,days){if(!days)return arr;const end=arr[arr.length-1][0];const t0=new Date(end);t0.setDate(t0.getDate()-days);const k=t0.toISOString().slice(0,10);return arr.filter(p=>p[0]>=k);}
function renderPressure(days){
  const H=cutDays(TZ.pressure.history,days);
  const dates=H.map(p=>p[0]);
  const mk=null;
  const series=COMP.map((c,i)=>({
    name:c[1],type:'bar',stack:'c',itemStyle:{color:c[2]},barMaxWidth:5,
    data:H.map(p=>p[2+i])
  }));
  series.push({name:'总指数',type:'line',z:5,symbol:'none',lineStyle:{color:'#f2e3b6',width:2.2},itemStyle:{color:'#f2e3b6'},
    data:H.map(p=>p[1]),
    markLine:{symbol:'none',silent:true,label:{show:false},lineStyle:{type:'solid',width:1},
      data:TZ.pressure.taco_marks.filter(m=>/强/.test(m.strength)).map(m=>({xAxis:(m.date.split('→').pop()||m.date).trim(),
        lineStyle:{color:m.strength==='最强'?'#e5534b':'#e5864b',opacity:.55},
        tooltip:{formatter:`<b>${esc(m.date)} · ${esc(m.strength)}</b><br>${esc(m.text)}`}}))}});
  if(!CH.p)CH.p=echarts.init($('chPressure'));
  CH.p.setOption({
    backgroundColor:'transparent',
    tooltip:{trigger:'axis',axisPointer:{type:'cross'},backgroundColor:'#171a20',borderColor:'#2a2e37',textStyle:{color:'#e8e6e1',fontSize:12}},
    legend:{textStyle:{color:'#9a958c',fontSize:11},top:0},
    grid:{left:46,right:16,top:36,bottom:60},
    xAxis:{type:'category',data:dates,axisLine:{lineStyle:{color:'#2a2e37'}},axisLabel:{color:'#9a958c',fontSize:10}},
    yAxis:{type:'value',name:'%',axisLabel:{color:'#9a958c'},splitLine:{lineStyle:{color:'#22262e'}}},
    dataZoom:[{type:'slider',height:18,bottom:22,borderColor:'#2a2e37',backgroundColor:'#171a20',textStyle:{color:'#9a958c'}}],
    series:series
  },true);
}
$('rng1').onclick=e=>{const b=e.target.closest('button');if(!b)return;[...$('rng1').children].forEach(x=>x.classList.toggle('on',x===b));renderPressure(+b.dataset.r);};

/* ---------- 支持率图 ---------- */
function renderApproval(days){
  const S=cutDays(TZ.approval.series,days);
  const dates=S.map(p=>p[0]), vals=S.map(p=>p[1]);
  const anns=TZ.approval.annotations.filter(a=>dates.includes(a.date)).map(a=>({
    xAxis:a.date,label:{show:true,formatter:(a.text.split('：')[0]||a.text).slice(0,6),color:'#d4a944',fontSize:10,position:'top'},
    lineStyle:{color:'#d4a944',opacity:.5},tooltip:{formatter:`<b>${a.date}</b><br>${esc(a.text)}`}}));
  if(!CH.a)CH.a=echarts.init($('chApproval'));
  CH.a.setOption({
    backgroundColor:'transparent',
    tooltip:{trigger:'axis',backgroundColor:'#171a20',borderColor:'#2a2e37',textStyle:{color:'#e8e6e1',fontSize:12},formatter:ps=>{const p=ps[0];return p.axisValue+'<br>净支持 <b>'+p.data+'%</b>';}},
    grid:{left:46,right:16,top:30,bottom:60},
    xAxis:{type:'category',data:dates,axisLine:{lineStyle:{color:'#2a2e37'}},axisLabel:{color:'#9a958c',fontSize:10}},
    yAxis:{type:'value',name:'%',axisLabel:{color:'#9a958c'},splitLine:{lineStyle:{color:'#22262e'}}},
    dataZoom:[{type:'slider',height:18,bottom:22,borderColor:'#2a2e37',backgroundColor:'#171a20',textStyle:{color:'#9a958c'}}],
    series:[{type:'line',symbol:'none',lineStyle:{width:2.2,color:'#f2e3b6'},itemStyle:{color:'#f2e3b6'},areaStyle:{opacity:.07},data:vals,
      markLine:{symbol:'none',data:[{yAxis:0,lineStyle:{color:'#9a958c',type:'dashed'},label:{show:false}}].concat(anns),
        tooltip:{formatter:p=>p.data.tooltip?p.data.tooltip.formatter:''}}}]
  },true);
}
$('rng2').onclick=e=>{const b=e.target.closest('button');if(!b)return;[...$('rng2').children].forEach(x=>x.classList.toggle('on',x===b));renderApproval(+b.dataset.r);};

/* ---------- TACO事件 ---------- */
function renderEvents(q){
  q=(q||'').trim();
  const list=TZ.taco_events.filter(e=>!q||(e.title+e.threat+e.retreat+e.reason+e.implication).includes(q));
  $('evCnt').textContent=list.length+' / '+TZ.taco_events.length+' 条 · 点击展开详情';
  $('evList').innerHTML=list.map(e=>`
    <div class="ev" onclick="this.classList.toggle('open')">
      <div class="ev-hd"><span class="ev-date">${esc(e.range)}</span><span class="badge b-${esc(e.strength)}">${esc(e.strength)}</span><span class="ev-title">${esc(e.title)}</span></div>
      <div class="ev-body">
        ${e.threat?`<p><span class="tag">威胁</span>${esc(e.threat)}</p>`:''}
        ${e.retreat?`<p><span class="tag t2">回撤</span>${esc(e.retreat)}</p>`:''}
        ${e.reason?`<p><span class="tag t3">研判</span>${esc(e.reason)}</p>`:''}
        ${e.implication?`<p><span class="tag t4">含义</span>${esc(e.implication)}</p>`:''}
      </div>
    </div>`).join('')||'<div class="empty">没有匹配的事件</div>';
}
$('evQ').oninput=e=>renderEvents(e.target.value);

/* ---------- Truths ---------- */
const KWS=['关税','tariff','美联储','fed','鲍威尔','powell','降息','rate','中国','china','俄罗斯','russia','伊朗','iran','油','oil','通胀','inflation','制裁','sanction','北约','nato','乌克兰','ukraine','协议','deal'];
let postFilter='all';
function renderPosts(){
  const q=($('postQ').value||'').trim().toLowerCase();
  let list=TR.posts;
  if(postFilter==='orig')list=list.filter(p=>!p.rt&&p.text&&!/^RT @/.test(p.text));
  if(postFilter==='kw')list=list.filter(p=>{const t=p.text.toLowerCase();return KWS.some(k=>t.includes(k));});
  if(q)list=list.filter(p=>p.text.toLowerCase().includes(q));
  $('postCnt').textContent=list.length+' / '+TR.posts.length+' 条（存档共'+TR.total_in_archive+'条，此处取最新120条）';
  $('postList').innerHTML=list.slice(0,80).map(p=>{
    let txt=esc(p.text);
    KWS.forEach(k=>{const re=new RegExp('('+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');txt=txt.replace(re,'<mark>$1</mark>');});
    txt=txt||'<span style="opacity:.5">（无文字内容，可能为图片/视频/转发）</span>';
    const tm=new Date(p.t).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    return `<div class="post ${p.rt?'rt':''}"><div class="tm">${tm} 北京 ${p.url?`· <a href="${esc(p.url)}" target="_blank" rel="noopener">原帖 ↗</a>`:''}</div><div>${txt}</div></div>`;
  }).join('')||'<div class="empty">没有匹配的帖子</div>';
}
document.querySelectorAll('.fbtn[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.toggle('on',x===b));postFilter=b.dataset.f;renderPosts();});
$('postQ').oninput=renderPosts;

/* ---------- 政策预期（Polymarket） ---------- */
function renderMarkets(){
  fetch('../data/polymarket.json?v='+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json();}).then(pm=>{
    if(!pm.markets||!pm.markets.length)throw 0;
    $('mkList').innerHTML=pm.markets.map(m=>`
      <div class="mk"><div class="mk-q">${esc(m.question)}</div>
      ${m.outcomes.map(o=>`<div class="oc"><span class="nm">${esc(o.name)}</span><div class="bar"><div class="fill" style="width:${(o.price*100).toFixed(1)}%"></div></div><span class="pc">${(o.price*100).toFixed(0)}%</span></div>`).join('')}
      <div class="note">24h成交 $${(m.vol24||0).toLocaleString()} · 截止 ${esc(m.end||'—')}</div></div>`).join('')
      +`<div class="note">数据源：Polymarket Gamma API（GitHub Actions每日抓取）· 更新 ${esc(pm.fetched_at||'').slice(0,16).replace('T',' ')} UTC · L2·交易所</div>`;
  }).catch(()=>{
    $('mkList').innerHTML=`<div class="card"><h3>政策预期（Polymarket 预测市场）</h3>
      <div class="empty">Polymarket 直连抓取正在部署（GitHub Actions 每日快照众议院/参议院/衰退/Fed等关键市场赔率）。<br><br>
      过渡方案：MM 特朗普专区的同类图表（2026众议院/参议院政党、衰退机率等，底层同为 Polymarket）<br>可用你的插件下载 CSV 后，到 <a class="lnk" href="mm_upload.html">更新MM数据</a> 上传，即可在周报工作区叠加查看。</div></div>`;
  });
}

/* ---------- 启动 ---------- */
Promise.all([
  fetch('../data/trump_zone.json?v='+Date.now()).then(r=>r.json()),
  fetch('../data/truth_posts.json?v='+Date.now()).then(r=>r.json())
]).then(([tz,tr])=>{
  TZ=tz;TR=tr;
  renderStats();renderPressure(365);renderApproval(365);renderEvents('');renderPosts();renderMarkets();
}).catch(e=>{
  document.body.insertAdjacentHTML('beforeend','<div class="empty">数据文件缺失：请先运行 scripts/fetch_trump.py</div>');
});
window.addEventListener('resize',()=>Object.values(CH).forEach(c=>c.resize&&c.resize()));
</script>
</body>
</html>

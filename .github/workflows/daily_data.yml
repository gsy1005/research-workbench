name: 每日数据管线
on:
  schedule:
    - cron: '40 23 * * *'   # 07:40北京(早报前)
    - cron: '40 12 * * *'   # 20:40北京(美盘前)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pandas lxml html5lib xlrd curl_cffi websocket-client
      - name: fetch_macro + fetch_extra
        env:
          JIN10_TOKEN: ${{ secrets.JIN10_TOKEN }}
        run: |
          python3 scripts/fetch_macro.py || true
          python3 scripts/fetch_extra.py || true
          python3 scripts/fetch_cn_macro.py || true
          python3 scripts/fetch_calendar.py || true
      - name: 提交更新
        run: |
          git config user.name "data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/chart_series.js data/macro_series.json data/macro_catalog.js data/auctions.json data/tic.json data/cftc.json data/liquidity.json data/calendar_consensus.json data/j10_store.json
          git diff --cached --quiet || git commit -m "每日数据 $(date +%F)"
          git pull --rebase origin main || true
          git push

name: Polymarket 政策预期快照
on:
  schedule:
    - cron: "5 1 * * *"   # 每天 09:05 北京时间
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/fetch_polymarket.py
      - name: commit & push
        run: |
          git config user.name "polymarket-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/polymarket.json
          git diff --cached --quiet || git commit -m "polymarket快照 $(date -u +%F)"
          git push

name: 刷新消息快照
on:
  schedule:
    - cron: '7,37 * * * *' # 每30分钟(UTC), 配合页面端60s/300s轮询
  workflow_dispatch:       # 允许手动触发
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: 抓取三站快照
        env:
          JIN10_TOKEN: ${{ secrets.JIN10_TOKEN }}
          AH_SESSION: ${{ secrets.AH_SESSION }}
          CS_TOKEN: ${{ secrets.CS_TOKEN }}
        run: python3 scripts/fetch_news.py
      - name: 提交更新
        run: |
          git config user.name "workbench-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/news_latest.json data/news_fallback.js
          git diff --cached --quiet || git commit -m "消息快照更新"
          git push
